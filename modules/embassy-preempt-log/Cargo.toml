[package]
name = "embassy-preempt-log"
version = "0.1.0"
authors = ["oveln"]
edition = "2024"
repository = "https://github.com/Oveln/embassy_preempt"
license = "MIT OR Apache-2.0"
description = "Logging macros for Embassy Preempt RTOS"
readme = "README.md"

[lib]
crate-type = ["rlib"]

# ==================================================================
# DEPENDENCIES
# ==================================================================
[dependencies]
# Logging and debugging dependencies (optional)
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
uart16550 = { version = "0.0.1", optional = true }
spin = { version = "0.10", optional = true }
portable-atomic = { version = "1.13.1" }

# ==================================================================
# FEATURE FLAGS
# ==================================================================
[features]
default = []
logs = ["log-os", "log-task", "log-mem", "log-timer", "log-scheduler"]
log-base = []
log-rtt = ["dep:defmt","dep:defmt-rtt", "dep:spin"]
log-uart = ["dep:defmt", "dep:uart16550", "dep:spin"]
log-os = ["log-base"]
log-task = ["log-base"]
log-mem = ["log-base"]
log-timer = ["log-base"]
log-scheduler = ["log-base"]
