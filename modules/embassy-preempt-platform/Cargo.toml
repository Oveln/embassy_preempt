[package]
name = "embassy-preempt-platform"
version = "0.1.0"
edition = "2021"
authors = ["oveln"]
description = "Platform abstraction layer for embassy_preempt RTOS"
license = "MIT OR Apache-2.0"

[lib]
name = "embassy_preempt_platform"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# Core dependencies (platform-agnostic)
spin = { version = "0.10.0" }
embassy-preempt-cfg = { path = "../embassy-preempt-cfg" }
embassy-preempt-log = { path = "../embassy-preempt-log" }

# Traits sub-crate (re-exported for convenience)
embassy-preempt-traits = { path = "traits" }

# Arch Runtime
embassy-preempt-riscv64-rt = { path = "archs/riscv64-rt", optional = true}

# Platform implementation crates (optional, selected via features)
stm32f4 = { path = "platforms/stm32f4", optional = true }
jh7110 = { path = "platforms/jh7110", optional = true }
ch32v3 = { path = "platforms/ch32v3", optional = true }
qemu-virt = { path = "platforms/qemu-virt", optional = true }

[features]
default = []

riscv64 = ["dep:embassy-preempt-riscv64-rt"]

# ===== PLATFORMS =====
# Each platform feature enables the corresponding platform implementation crate

# STM32F4 platform (ARM Cortex-M)
stm32f401re = ["dep:stm32f4"]

# JH7110 platform (RISC-V 64)
jh7110 = ["dep:jh7110", "riscv64"]

# CH32V3 platform (Qingke RISC-V)
ch32v307wcu6 = ["dep:ch32v3"]

# QEMU Virt platform (RISC-V 64)
qemu-virt = ["dep:qemu-virt", "riscv64"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(arm)',
    'cfg(riscv)',
    'cfg(riscv32)',
    'cfg(riscv64)',
] }
