[package]
name = "ch32v3"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ch32v3"
path = "src/lib.rs"

[dependencies]
# Core dependencies from main platform crate
portable-atomic = { version = "1.13.1" }
spin = { version = "0.10.0", features = ["portable-atomic"] }
embedded-hal = "1.0"
nb = "1"
critical-section = "1.1"
embassy-preempt-cfg = { path = "../../../embassy-preempt-cfg" }
embassy-preempt-log = { path = "../../../embassy-preempt-log" }
embassy-preempt-traits = { path = "../../traits" }

# Qingke dependencies
qingke = { version = "0.5.0", features = ["unsafe-trust-wch-atomics"] }
qingke-rt = { version = "0.5.0" }
ch32-metapac = { git = "https://github.com/ch32-rs/ch32-metapac", rev = "b1cbc7a98e43af3fd3170821654784e2c01cb26b", features = ["metadata", "rt"] }

[features]
default = []
highcode = ["qingke-rt/highcode"]
