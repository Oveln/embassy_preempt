[package]
name = "qemu-virt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "qemu_virt"
path = "src/lib.rs"

[dependencies]
# Core dependencies from main platform crate
portable-atomic = {version = "1.13.1", features = ["critical-section"] }
spin = {version = "0.10.0", features = ["portable-atomic"]}
embedded-hal = "1.0"
nb = "1"
critical-section = { version = "1.2", features = ["restore-state-bool"] }
embassy-preempt-cfg = { path = "../../../embassy-preempt-cfg" }
embassy-preempt-log = { path = "../../../embassy-preempt-log" }
embassy-preempt-traits = { path = "../../traits" }
embassy-preempt-riscv64-rt = { path = "../../archs/riscv64-rt", features = ["clear_bss"]}
# RISC-V dependencies
riscv = { version = "0.16.0", default-features = false, features = ["critical-section-single-hart"]}

[features]
default = []
