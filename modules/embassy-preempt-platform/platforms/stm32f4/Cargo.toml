[package]
name = "stm32f4"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "stm32f4"
path = "src/lib.rs"

[dependencies]
# Core dependencies from main platform crate
portable-atomic = "1.11.1"
spin = "0.10.0"
embedded-hal = "1.0"
nb = "1"
critical-section = "1.1"
embassy-preempt-cfg = { path = "../../../embassy-preempt-cfg" }
embassy-preempt-log = { path = "../../../embassy-preempt-log" }
embassy-preempt-traits = { path = "../../traits" }

# ARM Cortex-M dependencies
cortex-m = { version = "0.7.7", default-features = false }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m-semihosting = { version = "0.5", optional = true }

# STM32 support
stm32-metapac = { git = "https://github.com/embassy-rs/stm32-data-generated", tag = "stm32-data-e0cfd165fd8fffaa0df66a35eeca83b228496645", features = ["metadata"] }
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f401"], default-features = false }

[features]
default = []

# Timer drivers
time_driver_tim1 = []
time_driver_tim2 = []
time_driver_tim3 = []
time_driver_tim4 = []
time_driver_tim5 = []
time_driver_tim8 = []
time_driver_tim9 = []
time_driver_tim12 = []

# Debug features
early_debug_gpio = []
semihosting = ["dep:cortex-m-rt", "dep:cortex-m-semihosting"]
