[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32F401RETx"
rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
]

[target.'cfg(all(target_arch = "riscv32"))']
# runner = "probe-rs run --chip CH32V307"
runner = "wlink flash --enable-sdi-print --watch-serial -v"

rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
]

[build]
# target = "thumbv7em-none-eabi"
# target = "riscv32imc-unknown-none-elf"

[alias]
rb = "run --bin"
rrb = "run --release --bin"

# [env]
# DEFMT_LOG = "trace"
# DEFMT_LOG = "info"
[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.